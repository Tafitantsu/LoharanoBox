[alembic]

script_location = migrations

[alembic:logging]

level = INFO

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = INFO
handlers = console
qualname =

[logger_sqlalchemy]
level = INFO
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s

# Database URL.

# This will be overridden by the env var DATABASE_URL in env.py

# sqlalchemy.url = postgresql+psycopg2://Kariera4D_user:Password123@192.168.239.128:5432/Kariera4D_db
